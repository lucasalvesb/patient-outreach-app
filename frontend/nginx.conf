server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads are capped at 5 MB by the API; leave room for the multipart envelope.
    client_max_body_size 6m;

    # The API, Django admin and its static files are served by Django. Passing the
    # browser's Host (with port) keeps Django's CSRF origin check happy.
    location ~ ^/(api|django-admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's hashed build output can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is a client-side route of the React app.
    location / {
        try_files $uri /index.html;
    }
}
