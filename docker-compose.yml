services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: outreach
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
    ports:
      # Published on 5433 so a locally installed Postgres on 5432 doesn't clash.
      # Local (non-Docker) development of the backend connects here.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DJANGO_DEBUG: "false"
      # Demo-only value. Use a real secret for anything beyond local use.
      DJANGO_SECRET_KEY: "local-docker-demo-not-a-real-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: outreach
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
      # Creates the demo admin and agent logins on startup (existing users are left alone).
      SEED_DEMO_USERS: "true"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
